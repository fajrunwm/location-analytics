$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: network-area-stage
experiment_name: loc-network-centrality
code: ../../network
command: bash run_stage.sh ${{inputs.stage}} ${{inputs.area}} ${{outputs.data}} ${{inputs.outlets}}
inputs:
  stage: fetch
  area: jabodetabek
  outlets:
    type: uri_file
    path: ../../network/outlets_all.csv
outputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/loc-analytics/network-v1/
    mode: rw_mount
environment: azureml:loc-network@latest
compute: azureml:loc-cpu64-lp
