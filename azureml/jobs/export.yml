$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: network-export
experiment_name: loc-network-model
code: ../../network
# Bake the standalone NETWORK_DASHBOARD.html on Azure from the model + feature outputs.
command: >-
  python export_dashboard.py --data ${{inputs.data}} --model ${{inputs.model}} --areas ${{inputs.areas}}
  --out ${{outputs.site}}/NETWORK_DASHBOARD.html
inputs:
  areas: jabodetabek,dki,bandung,surabaya,semarang,yogyakarta,malang,medan,palembang,denpasar,makassar,balikpapan
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/loc-analytics/network-v1/
    mode: ro_mount
  model:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/loc-analytics/model-v1/
    mode: ro_mount
outputs:
  site:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/loc-analytics/site-v1/
    mode: rw_mount
environment: azureml:loc-network@latest
compute: azureml:loc-ded-e16
